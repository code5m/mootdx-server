---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod

  # 生产环境使用MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/mootdx?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:mootdx}
    password: ${MYSQL_PASSWORD:mootdx}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 禁用H2控制台
  h2:
    console:
      enabled: false

logging:
  level:
    com.mootdx.server: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
