# MooTDX服务器管理应用配置
# 功能：配置Spring Boot应用、数据库、日志等

spring:
  application:
    name: mootdx-server

  # 数据源配置 - 使用H2文件数据库（数据持久化）
  # 数据保存在项目根目录的 data/mootdxdb.mv.db 文件中
  datasource:
    url: jdbc:h2:file:./data/mootdxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
      jdbc:
        batch_size: 1000  # 批量插入大小
        order_inserts: true  # 排序插入以优化性能
        order_updates: true  # 排序更新以优化性能
    show-sql: false  # 关闭SQL日志以提升性能
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
        # 禁用二级缓存以提升批量插入性能
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # H2控制台配置（开发环境使用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.mootdx.server: DEBUG
    com.mootdx: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

# 自定义配置
mootdx:
  server:
    # 定时检查服务器状态的间隔（毫秒）
    check-interval: 60000
    # 连接超时时间（秒）
    connect-timeout: 10
    # 最大重试次数
    max-retries: 3
  tdx:
    # TDX行情服务器配置
    # 默认服务器地址（为空时自动选择）
    host: ""
    # 默认服务器端口
    port: 7709
    # 是否启用心跳
    heartbeat: true
    # 默认服务器列表（自动选择时使用）
